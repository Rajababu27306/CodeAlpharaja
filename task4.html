<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Music Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
}

.player{
    width:350px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:25px;
    text-align:center;
    color:white;
    box-shadow:0 8px 30px rgba(0,0,0,0.3);
}

.cover{
    width:220px;
    height:220px;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.song-title{
    font-size:24px;
    margin-top:15px;
    font-weight:bold;
}

.artist{
    opacity:0.8;
    margin-top:5px;
}

.time{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    font-size:14px;
}

.progress{
    width:100%;
    margin-top:10px;
    cursor:pointer;
}

.controls{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
}

.controls button{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
    background:white;
    color:#1e3c72;
    transition:0.3s;
}

.controls button:hover{
    transform:scale(1.1);
}

.volume{
    margin-top:20px;
}

.volume input{
    width:100%;
}

.playlist{
    margin-top:20px;
    max-height:150px;
    overflow-y:auto;
    text-align:left;
}

.playlist-item{
    padding:10px;
    margin:5px 0;
    background:rgba(255,255,255,0.15);
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
}

.playlist-item:hover,
.active{
    background:white;
    color:#1e3c72;
}

@media(max-width:400px){
    .player{
        width:95%;
    }

    .cover{
        width:180px;
        height:180px;
    }
}
</style>
</head>
<body>

<div class="player">

    <div class="cover">
        <img id="cover" src="https://picsum.photos/300" alt="">
    </div>

    <div class="song-title" id="title">Song 1</div>
    <div class="artist" id="artist">Artist 1</div>

    <audio id="audio"></audio>

    <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <input type="range" value="0" id="progress" class="progress">

    <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button onclick="playPause()" id="playBtn">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <div class="volume">
        🔊 Volume
        <input type="range" min="0" max="1" step="0.01" value="1" id="volume">
    </div>

    <div class="playlist" id="playlist"></div>

</div>

<script>

const songs = [
{
title:"Song 1",
artist:"Artist 1",
src:"song1.mp3",
cover:"https://picsum.photos/id/1015/300/300"
},
{
title:"Song 2",
artist:"Artist 2",
src:"song2.mp3",
cover:"https://picsum.photos/id/1025/300/300"
},
{
title:"Song 3",
artist:"Artist 3",
src:"song3.mp3",
cover:"https://picsum.photos/id/1035/300/300"
}
];

let currentSong = 0;

const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const cover = document.getElementById("cover");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const playBtn = document.getElementById("playBtn");
const playlist = document.getElementById("playlist");

function loadSong(index){
    audio.src = songs[index].src;
    title.innerText = songs[index].title;
    artist.innerText = songs[index].artist;
    cover.src = songs[index].cover;

    document.querySelectorAll(".playlist-item").forEach(item=>{
        item.classList.remove("active");
    });

    document.getElementById("song"+index).classList.add("active");
}

function playPause(){
    if(audio.paused){
        audio.play();
        playBtn.innerHTML="⏸";
    }else{
        audio.pause();
        playBtn.innerHTML="▶";
    }
}

function nextSong(){
    currentSong=(currentSong+1)%songs.length;
    loadSong(currentSong);
    audio.play();
    playBtn.innerHTML="⏸";
}

function prevSong(){
    currentSong=(currentSong-1+songs.length)%songs.length;
    loadSong(currentSong);
    audio.play();
    playBtn.innerHTML="⏸";
}

audio.addEventListener("timeupdate",()=>{

    progress.max=audio.duration;

    progress.value=audio.currentTime;

    current.innerText=formatTime(audio.currentTime);
    duration.innerText=formatTime(audio.duration);

});

progress.addEventListener("input",()=>{
    audio.currentTime=progress.value;
});

function formatTime(time){
    if(isNaN(time)) return "0:00";

    let min=Math.floor(time/60);
    let sec=Math.floor(time%60);

    if(sec<10) sec="0"+sec;

    return `${min}:${sec}`;
}

document.getElementById("volume").addEventListener("input",(e)=>{
    audio.volume=e.target.value;
});

audio.addEventListener("ended",()=>{
    nextSong();
});

songs.forEach((song,index)=>{
    let div=document.createElement("div");
    div.classList.add("playlist-item");
    div.id="song"+index;
    div.innerHTML=`🎵 ${song.title}`;
    div.onclick=()=>{
        currentSong=index;
        loadSong(index);
        audio.play();
        playBtn.innerHTML="⏸";
    };
    playlist.appendChild(div);
});

loadSong(currentSong);

</script>

</body>
</html>
